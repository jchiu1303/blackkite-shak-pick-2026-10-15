<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Kite — Visit</title>
<link rel="stylesheet" href="../assets/soft-placeholders.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#141414; --cream:#f4efe6; --yellow:#e2b100; --hair:#ece7df; --mute:#666; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  html,body { margin:0; background:#fff; color:var(--ink); font-family:Outfit,"Helvetica Neue",sans-serif; }
  img { display:block; max-width:100%; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  .feather { width:28px; height:28px; flex-shrink:0; }
  .feather circle { fill:#111; }
  .feather path { fill:#f4efe6; }
  .feather-w circle { fill:rgba(255,255,255,.12); }
  .feather-w path { fill:#fff; }

  .site-nav {
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 4vw; border-bottom:1px solid var(--hair);
    background:#fff; position:sticky; top:0; z-index:50;
  }
  .site-nav .mark { display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:.2em; font-size:11px; }
  .site-nav .nav { display:flex; gap:28px; }
  .site-nav .nav a { font-size:13px; letter-spacing:.12em; text-transform:uppercase; opacity:.85; }
  .site-nav .nav a:hover, .site-nav .nav a.is-on { opacity:1; border-bottom:1px solid var(--ink); padding-bottom:2px; }

  .hero { position:relative; height:100vh; min-height:640px; overflow:hidden; background:#1a1814; }
  .hero-media { position:absolute; inset:0; overflow:hidden; }
  .hero-media img { width:100%; height:100%; object-fit:cover; object-position:center 30%; animation:ken 14s ease-out forwards; }
  @keyframes ken { from{transform:scale(1)} to{transform:scale(1.03)} }
  @media (prefers-reduced-motion:reduce){ .hero-media img{animation:none} }
  .hero-chrome {
    position:absolute; top:0; left:0; right:0; z-index:3;
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 4vw; color:#fff; text-shadow:0 1px 12px rgba(0,0,0,.35);
  }
  .hero-chrome .mark { display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:.2em; font-size:11px; }
  .hero-chrome .nav { display:flex; gap:28px; }
  .hero-chrome .nav a { font-size:13px; letter-spacing:.12em; text-transform:uppercase; opacity:.92; }
  .hero-chrome .nav a:hover { opacity:1; }
  .hero-cta {
    position:absolute; left:0; right:0; bottom:0; z-index:3;
    display:flex; align-items:baseline; justify-content:space-between; gap:24px; flex-wrap:wrap;
    padding:18px 4vw 22px;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.45) 40%,rgba(0,0,0,.62));
    color:#fff;
  }
  .hero-cta .forbar { margin:0; font-size:11px; letter-spacing:.2em; text-transform:uppercase; opacity:.85; }
  .hero-cta .mail { display:inline-block; margin-top:6px; border-bottom:1px solid rgba(255,255,255,.85); padding-bottom:2px; font-size:20px; font-weight:500; }
  .hero-cta .mail:hover { border-bottom-color:var(--yellow); }
  .hero-cta .hint { font-size:14px; max-width:28ch; line-height:1.4; opacity:.9; }

  .stick {
    position:sticky; top:0; z-index:40;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 4vw; background:rgba(255,255,255,.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hair); transform:translateY(-100%); transition:transform .28s ease;
  }
  .stick.is-on { transform:translateY(0); }
  .stick .mark { display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:.2em; font-size:11px; }
  .stick .mail { border-bottom:1px solid var(--ink); font-size:15px; padding-bottom:1px; }

  .drop { background:var(--yellow); color:var(--ink); padding:9vh 6vw; }
  .drop p { margin:0 0 10px; font-size:12px; letter-spacing:.2em; text-transform:uppercase; }
  .drop h2 { margin:0; max-width:14ch; font-family:"Barlow Condensed",Impact,sans-serif; font-weight:700; font-size:clamp(56px,9vw,128px); line-height:.82; text-transform:uppercase; letter-spacing:-.01em; }

  .month-label { padding:48px 6vw 0; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--mute); }
  #month-cans { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--hair); }
  #month-cans article { padding:48px 3.5vw 56px; border-right:1px solid var(--hair); opacity:0; transform:translateY(18px); transition:opacity .55s ease,transform .55s ease,background .25s; }
  #month-cans article:last-child { border-right:0; }
  #month-cans article.is-in { opacity:1; transform:translateY(0); }
  #month-cans article:nth-child(2){ transition-delay:.04s } #month-cans article:nth-child(3){ transition-delay:.08s }
  #month-cans article:hover { background:#faf8f4; }
  #month-cans .shot { display:flex; align-items:flex-start; justify-content:center; min-height:380px; }
  #month-cans img { width:auto; max-width:100%; max-height:440px; height:auto; object-fit:contain; object-position:center top; transition:transform .35s ease; }
  #month-cans article:hover img { transform:translateY(-6px); }
  #month-cans b { display:block; margin-top:22px; font-family:"Barlow Condensed",Impact,sans-serif; font-size:clamp(28px,3vw,40px); font-weight:500; line-height:.95; }
  #month-cans i { display:block; margin-top:8px; font-style:normal; color:var(--mute); font-size:14px; }
  #month-cans em { display:block; margin-top:12px; font-style:normal; font-family:"Barlow Condensed",Impact,sans-serif; font-size:28px; font-weight:700; }

  .pair { padding:10vh 6vw; border-top:1px solid var(--hair); }
  .pair h2 { margin:0 0 28px; font-family:"Barlow Condensed",Impact,sans-serif; font-weight:500; font-size:clamp(42px,5vw,68px); line-height:.9; }
  .pair ul { margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; }
  .pair li { list-style:none; }
  .frame { position:relative; display:block; background:#111; overflow:hidden; }
  .frame img { width:100%; height:380px; object-fit:cover; object-position:center; }
  .play { position:absolute; left:50%; top:42%; width:56px; height:56px; margin:-28px 0 0 -28px; border:2px solid #fff; border-radius:50%; background:rgba(0,0,0,.35); pointer-events:none; }
  .play::after { content:""; position:absolute; left:22px; top:17px; border-style:solid; border-width:10px 0 10px 16px; border-color:transparent transparent transparent #fff; }
  .pair b { display:block; margin:14px 0 4px; font-size:15px; font-weight:600; }
  .pair span { display:block; color:#444; font-size:14px; line-height:1.45; }

  .trade { display:grid; grid-template-columns:.85fr 1.15fr; gap:48px; padding:12vh 6vw; background:var(--ink); color:var(--cream); }
  .trade h2 { margin:0; font-family:"Barlow Condensed",Impact,sans-serif; font-weight:500; font-size:clamp(48px,6vw,84px); line-height:.88; }
  .trade p { margin:0 0 18px; font-size:18px; line-height:1.45; max-width:42ch; }
  .trade .mail { color:var(--cream); border-bottom:1px solid var(--cream); font-size:20px; padding-bottom:2px; }
  .trade ul { margin:28px 0 0; padding:0; }
  .trade li { list-style:none; padding:14px 0; border-top:1px solid rgba(244,239,230,.18); font-size:15px; line-height:1.4; }
  .flock { max-width:200px; margin:22px 0 0; }
  .flock img { height:240px; width:100%; object-fit:cover; }

  .close { display:grid; grid-template-columns:1.2fr .8fr; gap:32px; padding:12vh 6vw; border-top:1px solid var(--hair); }
  .close h2 { margin:0; font-family:"Barlow Condensed",Impact,sans-serif; font-weight:500; font-size:clamp(42px,5vw,72px); line-height:.9; }
  .close p { margin:0; font-size:17px; line-height:1.5; max-width:34ch; color:#333; }
  .page-head { padding:8vh 6vw 2vh; }
  .page-head h1 { margin:0; font-family:"Barlow Condensed",Impact,sans-serif; font-weight:500; font-size:clamp(48px,7vw,96px); line-height:.88; }
  .page-head p { margin:14px 0 0; font-size:17px; color:#444; max-width:42ch; line-height:1.45; }
  .foot { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:18px 6vw 32px; font-size:13px; color:var(--mute); border-top:1px solid var(--hair); }
  .soft-note { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); padding:8px 6vw; background:#faf8f4; border-bottom:1px solid var(--hair); }

  @media (max-width:900px){
    #month-cans,.pair ul,.trade,.close { grid-template-columns:1fr; }
    #month-cans article { border-right:0; border-bottom:1px solid var(--hair); }
    #month-cans .shot { min-height:280px; } #month-cans img { max-height:320px; }
    .frame img { height:280px; } .hero { min-height:520px; height:92vh; }
  }
</style>
</head>
